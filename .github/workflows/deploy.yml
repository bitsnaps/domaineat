name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "✘ Build failed: dist/ directory not found"
            exit 1
          fi
          echo "✓ Build verified: dist/ directory exists"

      # ─── Netlify Deploy ─────────────────────────────────────────────────
      #
      # Option A: Netlify auto-deploy (recommended)
      #   Connect your GitHub repo in Netlify UI → Site settings → Build & deploy.
      #   Netlify auto-deploys on push to master. No workflow needed.
      #
      # Option B: Netlify CLI deploy from GitHub Actions
      #   Set these secrets in GitHub: Settings → Secrets and variables → Actions
      #     NETLIFY_AUTH_TOKEN  — Personal access token from Netlify UI → User settings → Applications
      #     NETLIFY_SITE_ID     — Found in Netlify UI → Site settings → General → Site ID
      #
      #   Then uncomment the step below:

      # - name: Deploy to Netlify
      #   uses: nwtgck/actions-netlify@v3
      #   with:
      #     publish-dir: dist
      #     production-branch: master
      #     production-deploy: true
      #     deploy-message: "Deploy from GitHub Actions — ${{ github.sha }}"
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
