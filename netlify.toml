[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback — all non-file routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API routes are handled by the function (no redirect needed — 
# Netlify auto-routes /.netlify/functions/api → api.ts)
