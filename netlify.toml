[build]
 command = "npm ci && npm run build"
 publish = "dist"

[functions]
 directory = "netlify/functions"
 # Use zisi bundler — esbuild tree-shakes pg (Sequelize loads it dynamically via require())
 node_bundler = "zisi"

# Scheduled function — runs every 10 minutes
[functions."scheduler"]
 schedule = "*/10 * * * *"
